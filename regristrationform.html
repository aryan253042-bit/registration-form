<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body{
            background-color: white;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            text-align: center;
        }
        header h1 {
            background-color: rgb(108, 5, 5);
            color: rgb(31, 31, 30);
            padding: 1em;
            text-align: center;
        }
        main{
            padding: 2em;
        }
        form{
            width: 50%;
            margin: auto;
            background-color: white;
            padding: 20px;
            border: 1px solid rgb(6, 6, 6);
            border-radius: 18px;
            box-shadow: 0 , 0 , 25px , rgb(247, 246, 246);
        }
        input , textarea , select{
            width: 95%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid rgb(9, 9, 9);
        }
        button[type = "submit"]{
            background-color: rgb(250, 247, 247);
            color: black; 
        }
        button[type = "Reset"]{
          background-color: white;
          color: black;
        }
    </style>
</head>
<body>
    <header>
        <h1>Registration Form </h1>
    </header>
    <main>
        <form action="">
          <label for="Name ">Full Name :</label>
          <input type="text" id="name" name = *name* required> <br> <br> 
          <label for="Email">Your Email:</label>
          <input type="text" id="Email" name = *Email* required> <br> <br>
          <label for="Phone no"> Phone no   :</label>
          <input type="text" id="Phone no" name = *Phone no* required> <br> <br>
          <label for="Gender">Gender : </label> <select name="Gender" id="Gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option> </select>
            <label for="Country">Country : </label> <select name="Country" id="Country">
            <option value="Country">Country</option>
            <option value="India">India</option>
            <option value="Russia">Russia</option>
            <option value="Nepal">Nepal</option>
            </select>
            <label for="State">State : </label> <select name="State" id="State">
                <option value="State">State</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Haryana">Haryana</option>
                <option value="Bihar">Bihar</option>
            </select> <br> <br>
            <button type="submit">SUBMIT</button> <br> <br>
            <button type="reset">RESET</button>
        
          
        


        

        </form>
    </main>
    <hr> 
    <p>
        
    </p>
</body>
</html>
